name: Run BSE Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  track-bse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restores state.json from previous runs to maintain fingerprint memory
      - name: Restore tracker state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: ${{ runner.os }}-bse-tracker-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bse-tracker-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Script
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          python tracker.py