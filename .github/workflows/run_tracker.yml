name: Run BSE Tracker

on:
  workflow_dispatch: # Allows triggers from your PowerShell script API call
  schedule:
    - cron: '*/15 * * * *' # Allows automatic background runs every 15 minutes

jobs:
  track-bse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restores state.json from previous runs to maintain announcement memory across triggers
      - name: Restore tracker state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: ${{ runner.os }}-bse-tracker-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bse-tracker-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py